[package]
name = "lutedrop"
version = "0.1.0"
description = "D&D audio command center"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "lutedrop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
ts-rs = { version = "12", features = ["serde-compat"] }
uuid = { version = "1", features = ["v4"] }
kira = "0.12"
rand = "0.8"
symphonia = { version = "0.5", features = ["mp3", "wav", "flac", "ogg", "pcm", "vorbis"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "sync"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs"] }
